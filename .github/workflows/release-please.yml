name: release-please

# Derives the next semantic version from the Conventional Commits on `dev` (the default branch) and
# keeps a release PR up to date: CHANGELOG.md, .release-please-manifest.json and the <Version> of
# BlazorKawaii.csproj. Merging that PR tags vX.Y.Z, creates the GitHub Release, publishes the NuGet
# package and deploys the demo. `main` is no longer part of the release path.
#
# Publishing lives in THIS workflow, not in a tag-triggered one: release-please creates the tag with
# GITHUB_TOKEN, and GitHub does not fire `on: push: tags` / `on: release` for events created by that
# token, so a tag-triggered publish would silently never run.

on:
  push:
    branches: [dev]
  # Manual re-run for a missed or failed push run. Without a merged-but-unprocessed release PR,
  # release_created stays false and nothing is published or deployed — unless `tag` is given.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Re-publish an existing release tag to nuget.org (e.g. v2.1.0). Leave empty to only refresh the release PR.'
        required: false
        default: 

permissions:
  contents: write
  pull-requests: write
  # release-please finds a merged release PR only by its `autorelease: pending` label, which it must
  # be able to create (an Issues-scoped endpoint).
  issues: write

# Never run two release-please jobs at once, and never cancel one mid-tag.
concurrency:
  group: release-please
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Packs the release that was just tagged and pushes it to nuget.org.
  # Requires a nuget.org Trusted Publishing policy for BlazorKawaii naming this repository and THIS
  # workflow file (release-please.yml), plus the NUGET_USER secret (the nuget.org profile name).
  # The tag and the GitHub Release exist before this job runs: if it fails, use "Re-run failed jobs"
  # (push uses --skip-duplicate, so a re-run is idempotent).
  nupkg:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the package to the GitHub Release
      id-token: write # GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A Razor class library cannot be packed from a clean checkout in one step: pack looks for the
      # static web assets manifest that only a build writes (obj/Release/…/staticwebassets.build.json).
      - name: Build
        run: dotnet build BlazorKawaii/BlazorKawaii.csproj --configuration Release

      - name: Pack
        run: dotnet pack BlazorKawaii/BlazorKawaii.csproj --configuration Release --no-build --output ./artifacts

      - name: Validate package
        run: |
          dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global
          for file in ./artifacts/*.nupkg; do
            meziantou.validate-nuget-package "$file"
          done

      # Deliberately not gated on NUGET_USER being set: a missing secret must fail the release
      # loudly instead of reporting green on a version that was tagged but never published.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Attach package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ./artifacts/*.nupkg --clobber

  # Deploys the demo of the released version to GitHub Pages (gh-pages branch).
  demo:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the gh-pages branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish demo
        run: dotnet publish Demo/Demo.csproj --configuration Release --output ./dist -p:GHPages=true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/wwwroot
          force_orphan: true
